<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Basic Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Complete school management system for Nazim" />
    <meta name="theme-color" content="#1976d2" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Note: X-Frame-Options should be set via HTTP headers, not meta tags -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <title>Nazim</title>
    <meta name="author" content="Nazim" />

    <meta property="og:title" content="Nazim Portal" />
    <meta property="og:description" content="Complete school management system for Nazim" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%icons/icon-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nazim Portal" />
    <meta name="twitter:description" content="Complete school management system for Nazim" />
    <meta name="twitter:image" content="%BASE_URL%icons/icon-512x512.png" />

    <!-- Preload only the above-the-fold critical font. Bold/Titr fonts load on demand via @font-face. -->
    <link rel="preload" href="%BASE_URL%fonts/Bahij%20Nassim-Regular.woff" as="font" type="font/woff" crossorigin="anonymous" />

    <!-- External files: production CSP is script-src 'self' 'unsafe-eval' (no unsafe-inline). Use %BASE_URL% so nested SPA routes like /platform/* do not request /platform/file.js. -->
    <script src="%BASE_URL%crypto-randomuuid-polyfill.js"></script>
    <script src="%BASE_URL%theme-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
